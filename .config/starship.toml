"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 800

format = """
[╭─](#5c5778)$os$directory$git_branch$git_status$nodejs$python$rust$lua$cmd_duration
[╰─](#5c5778)$character"""
right_format = "$time"

[os]
disabled = false
style = "#c792ff"
format = "[$symbol ]($style)"
[os.symbols]
Macos = ""

[directory]
style = "bold #7aa8ff"
format = "[ $path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold #ff79c6"
format = "[$symbol$branch]($style) "

[git_status]
style = "#ffd47a"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"

[nodejs]
symbol = " "
style = "#7ee0a8"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "#ffd47a"
format = "[$symbol$version( \\($virtualenv\\))]($style) "

[rust]
symbol = " "
style = "#ff8fa8"
format = "[$symbol$version]($style) "

[lua]
symbol = " "
style = "#7aa8ff"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "#6fe3e8"
format = "[ $duration]($style) "

[time]
disabled = false
style = "#5c5778"
format = "[$time]($style)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold #c792ff)"
error_symbol = "[❯](bold #ff6b8b)"
